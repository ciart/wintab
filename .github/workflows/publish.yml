name: Publish

on:
  push:
    tags:
      - "wintab-v*"
      - "wintab-sys-v*"
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

jobs:
  publish:
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Match tag to crate version
        id: tag
        shell: bash
        run: |
          crate="${TAG%-v*}"
          version="${TAG##*-v}"
          actual=$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg crate "$crate" '.packages[] | select(.name == $crate) | .version')
          if [ "$actual" != "$version" ]; then
            echo "::error::$crate is ${actual:-missing} in Cargo.toml, but the tag says $version"
            exit 1
          fi
          echo "crate=$crate" >> "$GITHUB_OUTPUT"

      - run: cargo publish -p ${{ steps.tag.outputs.crate }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
