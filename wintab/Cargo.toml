[package]
name = "wintab"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Safe wrapper for Wacom's Wintab 1.4 tablet API"
license = "MIT"
readme = "../README.md"
repository = "https://github.com/ciart/wintab"
keywords = ["wintab", "wacom", "tablet", "pen", "stylus"]
categories = ["api-bindings", "os::windows-apis", "hardware-support"]

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc"]

[target.'cfg(target_os = "windows")'.dependencies]
wintab-sys = { path = "../wintab-sys", version = "0.1" }
windows = { version = "0.62", features = ["Win32_Foundation"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
